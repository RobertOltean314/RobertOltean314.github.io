name: Refresh GitHub snapshot

# Keeps assets/data/github-snapshot.json current. The site reads the live
# GitHub API in the browser; this snapshot is the offline fallback and the
# source for the language-bytes chart.
on:
  schedule:
    - cron: '0 5 * * 1'      # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/refresh-github-data.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/github-snapshot.json; then
            echo "No changes."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/github-snapshot.json
            git commit -m "chore: refresh GitHub snapshot"
            git push
          fi
